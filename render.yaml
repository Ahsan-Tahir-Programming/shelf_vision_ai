# render.yaml
services:
  - type: web
    name: shelfvision-ai
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build && cd ..
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: chromadb-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
